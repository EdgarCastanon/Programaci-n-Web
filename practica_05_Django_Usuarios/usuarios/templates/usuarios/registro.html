{% extends "base.html" %}
{% block titulo %}Registro de usuario{% endblock %}

{% block contenido %}
<div class="contenedor">
    <h1>Registro de usuario</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Registrarse</button>
    </form>
    <p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
</div>
{% endblock %}
